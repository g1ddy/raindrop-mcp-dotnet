<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Explorer</title>
    <style>
        /* Pico.css v2 base styles manually inlined for zero dependencies */
        :root {
            --pico-font-family-sans-serif: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            --pico-line-height: 1.5;
            --pico-font-weight: 400;
            --pico-color: #373c44;
            --pico-background-color: #fff;
            --pico-primary: #1095c1;
            --pico-primary-hover: #08769b;
            --pico-muted-color: #73828c;
            --pico-border-radius: 0.25rem;
            --pico-spacing: 1rem;
            --pico-border-color: #e5e7eb;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --pico-color: #c2c7d0;
                --pico-background-color: #11191f;
                --pico-muted-color: #7b8a95;
                --pico-border-color: #373c44;
            }
        }
        body {
            font-family: var(--pico-font-family-sans-serif);
            line-height: var(--pico-line-height);
            color: var(--pico-color);
            background-color: var(--pico-background-color);
            margin: 0;
            padding: var(--pico-spacing);
        }
        main {
            max-width: 1200px;
            margin: 0 auto;
        }
        .bookmark-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }
        .bookmark-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--pico-border-color);
            border-radius: var(--pico-border-radius);
            padding: 1rem;
        }
        .bookmark-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            word-break: break-word;
            font-weight: bold;
        }
        .bookmark-excerpt {
            font-size: 0.9rem;
            color: var(--pico-muted-color);
            margin-bottom: 1rem;
        }
        .bookmark-footer {
            margin-top: auto;
            font-size: 0.8rem;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            background-color: transparent;
            color: var(--pico-primary);
            border: 1px solid var(--pico-primary);
            padding: 0.25rem 0.5rem;
            border-radius: var(--pico-border-radius);
            cursor: pointer;
        }
        button:hover {
            border-color: var(--pico-primary-hover);
            color: var(--pico-primary-hover);
        }
        pre {
            background-color: #f3f4f6;
            padding: 0.5rem;
            border-radius: var(--pico-border-radius);
            overflow-x: auto;
            font-size: 0.8rem;
        }
        @media (prefers-color-scheme: dark) {
            pre {
                background-color: #1f2937;
            }
        }
        .cover-placeholder {
            width: 100%;
            height: 150px;
            background-color: var(--pico-border-color);
            border-radius: var(--pico-border-radius);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--pico-muted-color);
            font-weight: bold;
            font-size: 1.5rem;
            text-transform: uppercase;
        }
        a {
            color: var(--pico-primary);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="container">
        <h2>Bookmark Explorer</h2>
        <div id="status">Connecting...</div>
        <div id="bookmarks-container" class="bookmark-grid" style="display: none;">
        </div>
    </main>
    <script type="module" src="/main.js"></script>
</body>
</html>
